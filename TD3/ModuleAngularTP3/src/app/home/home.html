<div class="container color-dark">
    <div class="col">
       <p>Un élément de liste</p> 
    </div>
    <div class="col">
        <p>Ma liste d'éléments ({{nbItems}})</p>
    </div>    
</div>

<div class="container color-light">
    <div class="col">
       <p class="sm">Un nouvel élément de liste</p> 
       <form>
            <input type="text" [(ngModel)]="objectifText" [value]="objectifText" class="txt">
            <input type="button" [value]="btnText" class="btn">
        </form>
        <p>Voici ce que vous écrivez : {{objectifText}}</p>
    </div>

    
    <div class="col">
       <p class="life-container">Un bloc</p> 
    </div>
</div>
