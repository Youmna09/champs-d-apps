<li [ngClass]="getColorEtu().class" >
    <span>
        Nom : 
            <span  [ngStyle]="{color : getColorEtu().color}">{{nomEtu()}}</span> , 
        Prénom : 
            <span [ngStyle]="{color : getColorEtu().color}">{{prenomEtu()}}</span>, 
        Statut : 
            <span *ngIf="estPresent(); else elseBlock">Présent</span>
            <ng-template #elseBlock>Absent</ng-template>, 
        Commentaire : 
            <span>{{commentaire()}}</span></span>
        
        <div 
            style="
                background-color: red;
                width: 30px;
                height: 30px;" 
            *ngIf="!estPresent()"
        > 
        </div>

        <button class="btn btn-success" (click)="setPresence()" [disabled]="estPresent()">Présent</button>
        <button class="btn btn-danger" (click)="setAbscence()" [disabled]="!estPresent()">Absent</button>
</li>
