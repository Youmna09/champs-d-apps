<li class="carc card-small">
    <h4>
        Nom : 
            <span>{{nomEtu()}}</span> , 
        Prénom : 
            <span>{{prenomEtu()}}</span>, 
        Statut : 
            <span *ngIf="estPresent(); else elseBlock">Présent</span>
            <ng-template #elseBlock>Absent</ng-template>, 
        Commentaire : 
            <span>{{commentaire()}}</span></h4>
        
        <div 
            style="
                background-color: red;
                padding: 2%;" 
                *ngIf="!estPresent()"
        > 
        </div>
</li>
