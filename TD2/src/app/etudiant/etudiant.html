<li [ngClass]="getColorEtu().class" >
    <span>
        Nom : 
            <span  [ngStyle]="{color : getColorEtu().color}">{{nomEtu()}}</span> , 
        Prénom : 
            <span [ngStyle]="{color : getColorEtu().color}">{{prenomEtu()}}</span>, 
        Statut : 
            <span *ngIf="statutEtu; else elseBlock">Présent</span>
            <ng-template #elseBlock>Absent</ng-template>, 
        Commentaire : 
            <span>{{commentaire()}}</span></span>
        
        <div 
            style="
                background-color: red;
                padding: 2%;" 
                *ngIf="!statutEtu"
        > 
        </div>

        <button class="btn btn-success" (click)="setPresence()">Présent</button>
        <button class="btn btn-danger" >Absent</button>
</li>
